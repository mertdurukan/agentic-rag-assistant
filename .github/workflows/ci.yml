name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only light dependencies for fast, deterministic unit tests.
      # (Heavy packages like torch / sentence-transformers / gradio are not
      #  needed for unit tests; the full install is done via `requirements.txt`.)
      - name: Install light test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff \
            "langchain-core>=0.3.30,<0.4" \
            "langchain-text-splitters>=0.3,<0.4" \
            "rank-bm25>=0.2.2" \
            "pydantic>=2.6" "pydantic-settings>=2.2"

      - name: Lint
        run: ruff check .

      - name: Run unit tests
        run: pytest -q
